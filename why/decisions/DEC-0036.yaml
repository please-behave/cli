id: DEC-0036
name: Gateway Authentication Is Explicit
context: >-
  GitHub Actions can authenticate to the gateway with a repository-bound
  credential instead of a stored API key (gateway:DEC-0007).
decision: >-
  Publish and register share an explicit project setting for authentication.
  API key authentication remains the default. A project can select GitHub
  OIDC to obtain a fresh token scoped to the origin of the gateway it calls.
rationale: >-
  Explicit selection keeps existing workflows compatible and lets workflows
  use repository-bound authentication without provisioning a shared secret.
