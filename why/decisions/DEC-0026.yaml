id: DEC-0026
name: API Contract Compatibility Versions
context: >-
  Please Behave exposes configuration and machine-readable interfaces.
  These contracts are still being defined and may change incompatibly.
  Consumers need to distinguish experimental contracts from contracts
  that promise compatibility.
decision: >-
  Each independently versioned API uses one nonnegative integer as its
  compatibility version. Version 0 is experimental and may change
  incompatibly without incrementing the version. Publishing version 1
  establishes a compatibility promise: compatible extensions retain the
  version, while incompatible changes increment it. Each API defines its
  contract boundaries, version declaration and compatibility rules.
  API versions are independent of the CLI release version. Version 0
  does not weaken validation or permit fallback to unsupported formats.
  Supporting older versions or providing migrations requires an explicit
  decision and is not implied by a version increment.
rationale: >-
  Experimental contracts can evolve without artificial version churn,
  while stable contracts make incompatible changes explicit to consumers.
