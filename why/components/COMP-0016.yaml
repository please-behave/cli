id: COMP-0016
name: Gateway Delivery
purpose: >-
  Delivers saved verification evidence, registrations and release facts to the gateway.
scope:
  - Selects the newest saved report and checks its eligibility for delivery.
  - Projects the attestation and derives the remote repository identity.
  - Prepares committed local rule registrations and checks the receipt against their canonical digests.
  - Prepares committed Rule Set registrations from the same member metadata and reports the ledger outcomes.
  - Submits configured deployment targets and validates their registration receipt.
  - Reports the release version and commit and validates the release fact receipt.
  - Authenticates the request and maps the delivery outcome to a diagnostic.
out_of_scope:
  - description: Calculating and persisting the verification verdict.
    owner: COMP-0014
  - description: Determining the coverage and freshness of the saved input.
    owner: COMP-0011
must_not:
  - Modify the report or include captured evidence and secrets in diagnostics.
files:
  - src/publish.rs
  - src/gateway.rs
  - src/gateway/auth.rs
  - src/register.rs
  - src/register/sets.rs
  - src/register/targets.rs
  - src/record.rs
depends_on:
  - COMP-0003
  - COMP-0006
  - COMP-0008
  - COMP-0011
  - COMP-0014
