id: REQ-0210
name: Adapter Profile Identifiers Are Unique
area: reviews
description: >-
  Adapter profile identifiers must be unique across local, rule-set-provided and
  independently imported adapter profiles, and a collision must be rejected as a
  configuration error without any override. An adapter profile shipped by several
  rule-set imports, including imports at different revisions of one
  repository, is one adapter profile when its definitions are identical; differing
  definitions collide.
rationale: >-
  A review must name exactly one adapter profile, and no import may silently replace
  another adapter. Unchanged adapter profiles must not force all imports of a
  repository onto one commit.
decisions:
  - DEC-0029
