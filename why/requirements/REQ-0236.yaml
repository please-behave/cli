id: REQ-0236
name: Input Is Compared Before Adapter Calls
area: integrity
description: >-
  Before an adapter is called for the first time in a run, the input must be
  compared with the snapshot, and no adapter call may start when the input
  has changed or cannot be verified.
rationale: >-
  Adapter calls cost money and must not be spent on input that is no longer
  the input the run was started for.
