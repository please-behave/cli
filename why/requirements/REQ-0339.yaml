id: REQ-0339
name: Review Result Records Its Adapter Profile
area: reporting
description: >-
  The result of a review whose adapter call was made must record the ID of the
  named adapter profile that produced it, and omit the adapter profile when the review
  used the default adapter profile or made no adapter call.
rationale: >-
  One run can use several adapter profiles, so only the individual result can
  say which entry produced it; the default adapter profile has no ID to record.
