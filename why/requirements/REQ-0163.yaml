id: REQ-0163
name: Typed Named Parameters
area: rules
description: >-
  A rule must be able to declare named parameters of the type string or file,
  each required or optional, within the bounds of the configuration
  reference, and an optional parameter without a value must stay absent
  without a substituted default.
rationale: >-
  One rule implementation can serve many projects when each project supplies
  its own values.
