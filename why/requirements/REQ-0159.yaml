id: REQ-0159
name: Checks-Only Needs No Review Input
area: rules
description: >-
  A checks-only run must not evaluate triggers or prepare review input, so it
  needs no change base. It must still validate the configuration structure,
  but a review that does not run must need neither a prompt nor parameter
  values.
rationale: >-
  The cheap run must work anywhere without review setup, yet never hide a
  broken configuration.
