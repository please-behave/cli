id: REQ-0295
name: Sync Can Be Approved In Advance
area: setup
description: >-
  When synchronization is started with the approval option, it must apply the
  displayed hook plan without a prompt, without reading standard input and
  without a terminal, while every other safety requirement still applies.
rationale: >-
  Unattended setup in CI and scripts needs a way to approve without weakening
  any safety check.
