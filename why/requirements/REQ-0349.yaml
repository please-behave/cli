id: REQ-0349
name: Gateway Authentication Is Configured Explicitly
area: configuration
description: >-
  Publish, register and record release must use the authentication method selected by
  publish.auth. The supported values are api-key (the default) and github-oidc.
  Other values are configuration errors. API key authentication requires
  publish.key_env and reads the key only from the named environment variable.
  Delivery fails if the key is unavailable. The key is sent only in the
  bearer authorization header and is never disclosed in output. GitHub OIDC
  does not require publish.key_env.
rationale: >-
  A project can configure delivery without storing the credential in version
  control or exposing it in logs.
decisions:
  - DEC-0036
