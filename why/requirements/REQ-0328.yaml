id: REQ-0328
name: Configuration Fields Are Documented Accurately
area: configuration
description: >-
  The configuration reference must describe every supported configuration
  field and correctly identify whether it is required or optional.
rationale: >-
  A project must be able to configure Please from the reference without
  guessing which settings exist or are required.
test_exemption: >-
  The CLI suite verifies supported fields and required markers against the
  configuration schemas. Agreement with the user documentation is checked
  during documentation review.
