id: REQ-0319
name: Artifacts Match The Tested Build
area: distribution
description: >-
  A published release artifact must be built from the source and carry the
  version that was tested for that release.
rationale: >-
  What users download is exactly what was verified and not a rebuild that
  nobody tested.
test_exemption: >-
  Verified by the Release workflow in .github/workflows/release.yml: native
  candidates are version-stamped before smoke testing, which checks the
  binary version, and the shared release evidence binds the archive hashes
  to the planned source and version. The evidence gate rejects mismatches
  before publication; .github/scripts/test_release.py covers the packaging.
