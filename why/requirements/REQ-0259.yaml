id: REQ-0259
name: Status Shows The Saved Run
area: reporting
description: >-
  Wherever status shows the selection, the omitted reviews, the required rules
  or whether the run was limited to checks, it must take them from the saved
  report, using the same terms as the plan preview, and never from what the
  current configuration would select.
rationale: >-
  A saved result must be read against what that run was asked to do, even
  after the configuration changed.
