id: REQ-0309
name: Unsafe Hook Files Are Conflicts
area: setup
description: >-
  The file of a supported hook that is reached through a symlink, is not a
  regular file, carries malformed or duplicated ownership markers, is owned by
  another repository or is not an executable POSIX sh script must be reported
  as a conflict that stops reconciliation before anything is written, and such
  a file must never be overwritten.
rationale: >-
  Hooks that Please cannot change safely are left to the user, because a
  broken hook is worse than a missing one.
decisions:
  - DEC-0020
