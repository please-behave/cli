id: REQ-0318
name: Release Checksums
area: distribution
description: >-
  Each release must publish a checksum file named `SHA256SUMS` that lists the
  SHA-256 checksum of each of its archives in the format of `sha256sum`.
rationale: >-
  Users can verify that what they downloaded is what was published.
test_exemption: >-
  Verified by the shared evidence action, which restores exactly the
  archives of the policy in .github/release-artifacts.json, and by the
  sha256sum step in .github/workflows/release.yml that generates SHA256SUMS
  from exactly those archives.
