include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/releasable-open-source-software/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/why/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
]

[task_config]
includes = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//mise-tasks/release?ref=c13b67c59b7ab4224fb2544a2de6fa2f49d36e2f",
]

[tools]
"github:please-behave/cli" = "0.21.0"
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt,clippy,llvm-tools" }
python = "3.15.2"
node = "26.13.1"
gh = "2.104.0"
ruff = "0.17.5"
"cargo:cargo-audit" = "0.23.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:boyter/scc" = "4.1.0"

[tasks.build]
description = "Build the native release executable"
run = "cargo build --release --locked"

[tasks.format]
description = "Format Rust, Python and shell sources"
run = ["cargo fmt --all", "ruff format", "git ls-files -z '*.sh' | xargs -0 -r shfmt -w"]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Fetch locked Cargo dependencies for CI and offline Git hooks"
run = "cargo fetch --locked"

[tasks.package]
description = "Package the already-built and smoke-tested native candidate"
run = "python3 .github/scripts/package-release.py"
