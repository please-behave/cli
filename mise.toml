[tools]
"github:please-behave/cli" = "0.10.0"
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt,clippy" }
python = "3.15.2"
node = "26.13.0"
actionlint = "1.7.12"
yq = "4.54.3"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
gh = "2.103.3"
ruff = "0.17.4"
"cargo:cargo-audit" = "0.22.2"

[tasks.build]
description = "Build the native release executable"
run = "cargo build --release --locked"

[tasks.release]
description = "Start the GitHub Release workflow for remote main; --install waits, then adopts the release as governor"
usage = 'flag "--install" help="Wait for success, pin the new version in mise.toml and run mise install"'
run = 'python3 tools/release.py ${usage_install:+--install}'

[tasks.format]
description = "Format Rust and Python source"
run = ["cargo fmt --all", "ruff format"]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.prepare]
description = "Fetch locked npm and Cargo dependencies for CI and offline Git hooks"
run = ["npm ci --ignore-scripts", "cargo fetch --locked"]

[tasks.package]
description = "Package the already-built and smoke-tested native candidate"
run = "python3 .github/scripts/package-release.py"
