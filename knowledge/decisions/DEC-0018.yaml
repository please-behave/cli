id: DEC-0018
name: Check-Gated AI Reviews
context: >-
  AI reviews may incur external provider costs and should not consume
  resources unnecessarily when deterministic validation has already
  established that an execution cannot succeed. Repeated development
  attempts may fail deterministic checks before eventually producing
  a successful result.
decision: >-
  Please executes deterministic checks before starting AI reviews.
  The two execution phases must not overlap. AI reviews may start
  only after the deterministic check phase has completed successfully.
  Any check failure or execution error prevents AI reviews.
  If fail-fast terminates the check phase early, AI reviews must not
  start. Skipped checks caused by failed dependencies do not
  independently determine the aggregate outcome; the originating
  failure remains authoritative. The execution report must distinguish
  reviews that were not executed because the check phase did not
  satisfy the gating condition. This behavior is mandatory for now;
  configurable overrides may be introduced through a future decision.
rationale: >-
  Separating deterministic validation from AI reviews avoids spending
  provider resources on executions that cannot pass their mandatory
  checks. Since deterministic checks are always blocking (DEC-0006),
  any check failure prevents the execution from succeeding and makes
  subsequent AI reviews unnecessary. Preventing reviews after
  incomplete fail-fast execution avoids evaluating partially validated
  results. A fixed default keeps execution predictable and
  cost-conscious while allowing future extensions if justified by
  concrete use cases.
capabilities:
  - CAP-0007
  - CAP-0008
  - CAP-0010
  - CAP-0011
  - CAP-0012
  - CAP-0013
  - CAP-0016
