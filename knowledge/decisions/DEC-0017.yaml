id: DEC-0017
name: History-Based Rule Scheduling
context: >-
  Please executes multiple independent rules concurrently, but static
  execution order can leave available capacity underutilized or delay
  long-running dependency chains. Rule execution reports already contain
  duration measurements that can inform scheduling decisions. Local
  execution latency is particularly important because developers run
  governance checks repeatedly during development. Scheduling should
  improve over time without introducing manual priority configuration,
  shared infrastructure, or substantial operational complexity.
decision: >-
  Please prioritizes runnable rules using estimated execution durations
  derived from previous local runs. Estimates are maintained per stable
  rule identity in a non-versioned local cache using a lightweight
  moving average. Successfully completed executions update the estimates;
  rules without history receive a uniform fallback estimate. Scheduling
  priority is based on the estimated longest remaining dependency path,
  including the rule itself. When execution capacity becomes available,
  the scheduler prefers the highest-priority eligible rule while respecting
  dependencies, concurrency limits, and exclusive resource constraints.
  Rules waiting for prerequisites or resources do not reserve execution
  capacity. Equal priorities are resolved deterministically. Scheduling
  history is not committed to the repository or synchronized between
  environments. The optimization introduces no user-configurable
  priorities, weights, or duration estimates.
rationale: >-
  Historical duration estimates allow scheduling to adapt to actual
  project characteristics without requiring users to maintain performance
  metadata. Considering remaining dependency paths prioritizes work that
  may delay completion of the entire run rather than simply starting
  individually expensive rules first. Local caching keeps the mechanism
  lightweight and focuses optimization on frequently repeated developer
  workflows. Resource and dependency constraints remain authoritative,
  preserving correctness independently of scheduling decisions. A simple
  heuristic offers practical improvements without the complexity of
  globally optimal scheduling.
capabilities:
  - CAP-0007
  - CAP-0009
  - CAP-0012
  - CAP-0013
  - CAP-0016
