id: DEC-0014
name: Binding-Qualified Rule Identity
context: >-
  Rules may originate from local definitions or independently maintained
  external rule sets. Different sources may define rules with identical
  names, and the same rule may be selected at multiple execution points.
  Rule implementations may also be reused with different parameters.
  Without stable identities and unambiguous resolution, rule selection,
  execution, and reporting become difficult to reason about.
decision: >-
  A local rule is identified by its rule ID. An imported rule is
  identified by its rule ID qualified with its import binding, which
  the consumer's import configuration determines: the source, the
  directory, the parameter values and the occurrence among identical
  bindings. Rule sets define no namespace and consumers cannot remap
  identities.
  Rule identities must be unique within their source scope, the local
  project or one import binding, independent of the selection of a run.
  Duplicate identities are configuration errors detected when the
  configuration is loaded, even when their definitions are identical. A rule may be selected at multiple
  execution points without changing its configuration. Execution
  points select rules but do not override their parameters. Different
  parameterizations of the same underlying implementation require
  distinct rule definitions. Each rule identity may be executed at
  most once per run.
rationale: >-
  Binding-qualified identities allow independently maintained rule sets
  to coexist without requiring global naming coordination or a namespace
  that every rule set author must choose and keep collision-free. Stable rule
  identities simplify configuration resolution, result reporting,
  and future auditing. Separating rule definitions from execution
  points preserves predictable behavior while allowing scripts and
  other implementations to be reused. Checking uniqueness per source
  scope keeps every reference resolvable to exactly one rule without
  depending on which rules a run selects, while separate import
  bindings still let independent rule sets coexist.
