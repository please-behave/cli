id: DEC-0016
name: Explicit Check Dependencies
context: >-
  Please executes deterministic checks concurrently while respecting
  resource constraints. Some checks require successful completion of
  other checks, such as a smoke test depending on a build. Previously,
  users could influence execution order through configuration, but
  ordering alone does not guarantee that prerequisites have completed
  successfully. Automatic scheduling optimization requires these
  correctness constraints to be expressed explicitly.
decision: >-
  Deterministic checks may declare dependencies on other deterministic
  checks through an optional depends_on property. AI reviews cannot
  declare dependencies and cannot be referenced as dependencies.
  Dependencies reference stable check identities, including namespaces,
  and must resolve within the effective execution selection. Missing
  dependencies, ambiguous identities, self-dependencies, and cycles
  are configuration errors. A check may execute only after all declared
  dependencies have completed with PASS. Checks whose prerequisites
  fail, encounter execution errors, or are skipped must not execute
  and are reported as skipped with an explicit reason. Dependency
  effects propagate transitively. Independent checks remain eligible
  for execution unless explicit fail-fast behavior prevents further
  scheduling. Existing resource constraints remain authoritative.
  Configurations without dependencies retain their existing check
  execution semantics.
rationale: >-
  Explicit check dependencies separate correctness constraints from
  scheduling preferences and enable safe parallel execution without
  requiring users to manually arrange checks. Restricting dependencies
  to deterministic checks keeps the dependency model simple and
  focused. Requiring explicit selection prevents dependencies from
  silently expanding execution scope. Resource constraints remain
  independent of dependency ordering. Reporting skipped dependents
  separately from actual failures preserves accurate execution and
  audit information.
capabilities:
  - CAP-0003
  - CAP-0007
  - CAP-0008
  - CAP-0009
  - CAP-0012
  - CAP-0013
  - CAP-0016
