id: REQ-0060
name: Blocked Dependents Are Not Run
area: checks
description: >-
  A check whose prerequisite ended with FAIL or ERROR, was cancelled or was
  skipped must not run and must be reported as NOT_RUN, naming its immediate
  prerequisite and that prerequisite's outcome.
rationale: >-
  A dependent check may rely on preconditions that its prerequisite did not
  establish when it was unsuccessful, so running it would waste time, produce
  misleading results and hide the real cause.
decisions:
  - DEC-0016
