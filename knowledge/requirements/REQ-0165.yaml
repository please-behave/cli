id: REQ-0165
name: Parameters Checked Before Execution
area: rules
description: >-
  Before an enabled selected rule executes, its required values, parameter
  types, parameter names and values must be validated against the
  configuration reference, and a failure must be reported for that rule and
  name the parameter and the reason.
rationale: >-
  A rule must fail with a clear cause before it starts.
decisions:
  - DEC-0015
