id: REQ-0106
name: Header Reviews Need A Hook Message
area: reviews
description: >-
  A selected commit-header review must be blocked in direct runs and offline
  previews that have no validated commit message file, while disabled or
  unselected header reviews must not require one.
rationale: >-
  Without the message of a real commit there is nothing to judge, and
  unrelated runs must stay unaffected.
