id: REQ-0161
name: Setup Errors Are Fatal
area: rules
description: >-
  A parameter error or a missing prompt of a selected, enabled review must
  prevent a successful result, whether or not the review is advisory, and must
  not count as an outcome of the review.
rationale: >-
  Advisory reviews may be unreliable, but a broken setup is a mistake of the
  project that must be fixed.
decisions:
  - DEC-0007
