id: REQ-0317
name: Release Archive Layout
area: distribution
description: >-
  Each release archive must be named by the version and the target as the
  release documentation defines and must contain one directory of the same
  name with the `please` executable, the README and the license.
rationale: >-
  Installers and automation can find the right archive and its content without
  guessing.
test_exemption: >-
  Verified by .github/scripts/package-release.py and the mandatory
  .github/scripts/verify-release.py publication gate in
  .github/workflows/release.yml. Tooling tests in
  .github/scripts/test_release.py exercise archive naming, member layout,
  executable permissions and README/LICENSE content.
