id: REQ-0107
name: Header Is Validated
area: reviews
description: >-
  The header of a header review must be the first line of exactly one
  regular, non-symlink message file, within the size bound of the adapter
  protocol, nonempty and free of control characters, and an invalid header
  must prevent success.
rationale: >-
  Only a well-formed header can be judged reliably.
