id: REQ-0065
name: Reviews Start After Successful Checks
area: reviews
description: >-
  Reviews must start only after the check phase has completed without a check
  FAIL or ERROR and without early termination by fail-fast, and the two phases
  must never overlap.
rationale: >-
  Provider calls cost money and must not be spent on a run that cannot succeed
  anyway.
decisions:
  - DEC-0018
