id: REQ-0224
name: Authentication Belongs To The Adapter
area: reviews
description: >-
  Please must not authenticate with providers or store provider credentials,
  and must offer no setting for authentication, model selection or tool use
  outside the opaque parameters.
rationale: >-
  Credentials and provider details stay out of the product, its configuration
  and its reports.
decisions:
  - DEC-0010
test_exemption: >-
  A negative requirement: no authentication, model or tool setting exists.
  The configuration loader rejects unknown settings, so the absence follows
  from the closed configuration; a single test could not show it for the whole
  product.
