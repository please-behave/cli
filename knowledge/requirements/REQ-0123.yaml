id: REQ-0123
name: No Cost Estimate Or Budget
area: reviews
description: >-
  Please must not estimate monetary cost or enforce a total token budget for
  reviews.
rationale: >-
  Token counts are adapter claims and cannot serve as billing or quota
  statements.
test_exemption: >-
  A negative requirement: no cost or budget feature exists. The closed report
  schema (knowledge/contracts/report/report.schema.json) has no field for
  either and the configuration loader rejects unknown settings, so there is
  no behavior to assert beyond that absence.
