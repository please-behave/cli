id: REQ-0024
name: Exit Status Mapping
area: checks
description: >-
  A check must be reported as PASS for exit status 0, as FAIL for exit status
  1 and as ERROR for any other exit status or when a signal terminated it.
rationale: >-
  The exit status separates a found violation from a technical failure, and
  anything unexpected, such as a crash or a missing tool, must never look like
  a violation.
