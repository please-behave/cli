id: REQ-0032
name: Plan Identity Is Independent Of Execution Strategy
area: checks
description: >-
  The identity of an execution plan must not depend on the concurrency limit,
  the termination setting and grace period, estimated durations, the order and
  duplication of declared dependencies, or whether fail-fast is requested, and
  a plan must keep its full selection regardless of fail-fast.
rationale: >-
  An unchanged plan identity tells everyone that two runs used the same
  selection, however they were scheduled.
