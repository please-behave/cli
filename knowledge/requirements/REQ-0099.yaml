id: REQ-0099
name: Review Receives Declared Input
area: reviews
description: >-
  For each review Please must give the adapter exactly the input the review
  declares: its prompt and criteria, the selected context documents, the
  content and change set of the files in its scope as selected and, at the
  commit-msg execution point, the commit message as a whole.
rationale: >-
  A provider serves many rules, so each rule must declare what its review
  needs, and the provider decides how to use it.
decisions:
  - DEC-0022
