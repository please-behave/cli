id: REQ-0118
name: Invalid Adapter Calls Are ERROR
area: reviews
description: >-
  An adapter call must end as ERROR when it exits with a status other than 0
  or 1, times out, cannot be started, or at exit status 0 or 1 does not
  produce a response that satisfies the response contract, such as wrong
  types, unknown keys or excess size.
rationale: >-
  A result that cannot be trusted must never be read as PASS.
decisions:
  - DEC-0025
