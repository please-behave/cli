id: REQ-0208
name: Providers Are Imported Independently
area: configuration
description: >-
  A consuming project must be able to import a named provider from a Git
  repository independently of any rule set and at its own pinned reference,
  and such an import must need no rules, rule sets or execution points.
rationale: >-
  Adapters and rules are maintained by different parties and must be versioned
  separately.
