id: REQ-0139
name: Labels Agree Everywhere
area: reporting
description: >-
  Progress, results and saved status must show the same display name for a
  rule, even after the configuration changed, and the technical ID and the
  full provenance must remain available in the structured output and in the
  details.
rationale: >-
  A rule must keep one label from the live run to the saved status, even after
  the configuration changed, without losing its technical identity.
