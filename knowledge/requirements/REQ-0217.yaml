id: REQ-0217
name: Adapter Profile Needs Command And Timeout
area: reviews
description: >-
  An adapter profile must declare an adapter command and a timeout within the bounds
  of the configuration reference, and a missing or invalid value must be
  rejected as a configuration error.
rationale: >-
  An adapter must be named explicitly and must not stall verification forever
  unless the owner explicitly chooses so.
