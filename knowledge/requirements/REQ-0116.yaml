id: REQ-0116
name: Verdict Explanation
area: reviews
description: >-
  A PASS or FAIL response must contain a one-line summary and findings within
  the bounds of the adapter protocol and may contain a longer explanation.
rationale: >-
  Results must stay uniform and compact so tools and people can rely on them,
  while the depth of the explanation stays a choice that affects cost.
decisions:
  - DEC-0025
