id: REQ-0034
name: Resource Exclusion
area: checks
description: >-
  Checks that declare the same resource, whether local or imported, must never
  run at the same time within one invocation, checks without a resource must
  not be restricted by it, and the exclusion must not lock other Please
  invocations.
rationale: >-
  Checks that touch the same mutable state must not run together, or they
  corrupt each other's results.
