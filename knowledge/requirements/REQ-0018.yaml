id: REQ-0018
name: Malformed References Are Rejected
area: checks
description: >-
  An unknown reference prefix, a malformed reserved reference, a malformed
  `@param/` name and a reference to an undeclared parameter must be rejected
  as configuration errors that name the supported tokens and the literal
  escape.
rationale: >-
  A mistyped reference must fail loudly with guidance instead of reaching the
  tool as plain text.
