id: REQ-0122
name: Unreported Usage Stays Unavailable
area: reviews
description: >-
  A token counter that an adapter does not report as a positive number, whether
  zero, negative or empty, must count as not reported, and when any adapter
  call does not report a counter, the summed counter must be unavailable and
  never zero.
rationale: >-
  A zero or a partial sum would claim a measurement nobody made, and an
  adapter that cannot count says so by reporting nothing.
