id: REQ-0009
name: No Runtime Installation
area: checks
description: >-
  Please must not install tools or dependencies in order to run a check
  command.
rationale: >-
  Please verifies a project and must not change a developer's environment on
  its own.
test_exemption: >-
  The requirement is the absence of any installation step, so there is no
  behavior to assert beyond a missing tool ending the check with ERROR, which
  REQ-0011 covers.
