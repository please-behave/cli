id: REQ-0104
name: Advisory Review Outcomes Stay Visible
area: reviews
description: >-
  A FAIL or an ERROR of an advisory review must remain visible in the results
  and must not prevent a successful result.
rationale: >-
  Unstable AI services and prompts that are still being refined must not block
  delivery, while the outcome stays visible.
decisions:
  - DEC-0007
