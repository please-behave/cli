id: REQ-0101
name: Verdict Is Binary
area: reviews
description: >-
  A review must assess with PASS or FAIL, and a conclusion that cannot be
  established as PASS must be FAIL; ERROR must be reserved for technical
  failures such as an adapter that cannot run, a timeout or an invalid
  response.
rationale: >-
  ERROR means the review could not take place and FAIL means it found a
  problem or could not justify PASS, which tells owners whether to fix the
  project or the provider setup.
