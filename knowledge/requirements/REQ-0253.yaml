id: REQ-0253
name: Report Is Saved Atomically
area: reporting
description: >-
  After every run that executes its rules, including one that ends with FAIL
  or ERROR, Please must save the report by replacing the previous one
  atomically.
rationale: >-
  Status and tools must always find a complete report, and a failed run is the
  one that most needs one.
test_exemption: >-
  Atomicity comes from replacing last.json through a persisted temporary file
  in the same directory (src/report.rs). Interrupting a write cannot be
  reproduced deterministically in an offline test.
