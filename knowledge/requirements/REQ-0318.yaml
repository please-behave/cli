id: REQ-0318
name: Release Checksums
area: distribution
description: >-
  Each release must publish a checksum file, as the release documentation defines it, that
  covers all of its archives.
rationale: >-
  Users can verify that what they downloaded is what was published.
test_exemption: >-
  Verified by the mandatory .github/scripts/verify-release.py
  publication gate in .github/workflows/release.yml, which requires the
  complete archive set, and by the sha256sum step that generates SHA256SUMS
  from exactly those archives. The tooling tests in
  .github/scripts/test_release.py check incomplete and corrupt artifact sets.
