id: COMP-0004
name: External Sources
purpose: >-
  Fetches external rule sets and adapter profiles from Git and loads them in
  isolation.
scope:
  - >-
    Resolves configured Git imports of rule sets and adapter profile definitions at
    the selected references.
  - >-
    Caches fetched sources locally and records the origin of every imported
    rule.
  - >-
    Requires the user's trust in every imported Git repository and keeps the
    user-level trust store.
  - >-
    Loads imported definitions in isolation and combines them with the local
    configuration into one project.
out_of_scope:
  - description: What imported rules mean and how they are validated.
    owner: COMP-0003
  - description: Executing imported rules.
    owner: COMP-0002
must_not:
  - >-
    Read trust decisions from project files, imported content or the Git
    directory of a project.
  - >-
    Let a consumer override properties of an imported rule such as its
    blocking behavior.
  - >-
    Detect available updates or ask for interactive update confirmation.
  - >-
    Let a rule set or a consumer choose or remap the binding qualifier of imported rule identities.
files:
  - src/external.rs
  - src/external/cache.rs
  - src/external/trust.rs
depends_on:
  - COMP-0003
  - COMP-0006
  - COMP-0008
  - COMP-0009
  - COMP-0011
