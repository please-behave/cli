name: Dependency Audit
on:
  schedule:
    - cron: '17 3 * * *' # UTC: 05:17 in summer and 04:17 in winter in Europe/Berlin.
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false' # Install tools explicitly before running tasks.
  AUDIT_FAIL_ON: medium # Lowest severity that fails the run: low, medium, high or critical.
jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install audit tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node rust cargo:cargo-audit
      - name: Scan Cargo and npm dependencies
        run: python3 .github/scripts/dependency-audit.py scan --report dependency-audit.json
      - name: Report findings
        if: ${{ !cancelled() && hashFiles('dependency-audit.json') != '' }}
        run: python3 .github/scripts/dependency-audit.py report --report dependency-audit.json --fail-on "$AUDIT_FAIL_ON"
      - name: Upload report
        if: ${{ !cancelled() && hashFiles('dependency-audit.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 30
