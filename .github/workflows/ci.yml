name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    uses: christianpflugradt/please-behave-governance/.github/workflows/ci-check.yml@4a3679d9da910272ca4d741307e4cbbe2bde6d6e # updates/workflows/ci
    with:
      env: |
        BUILD_TARGET=x86_64-unknown-linux-gnu
        CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
