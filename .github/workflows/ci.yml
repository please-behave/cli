name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    uses: christianpflugradt/please-behave-governance/.github/workflows/ci-check.yml@8572daf10c4f05dfbded34301187e00134259864 # updates/workflows/ci
    with:
      env: |
        BUILD_TARGET=x86_64-unknown-linux-gnu
        CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
