name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Prepare tools and dependencies
        run: bash scripts/prepare-ci.sh
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install pinned published Please Behave
        uses: please-behave/action@3f726664f6a18193ac1bfa0f542e34ba76f24523 # v1.1.1
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Resolve external Rule Sets and synchronize hooks
        run: please sync --yes
      - name: Establish review comparison baseline
        run: python3 scripts/review-change-base.py
      - name: Run Please Behave checks and applicable reviews
        uses: please-behave/action@3f726664f6a18193ac1bfa0f542e34ba76f24523 # v1.1.1
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: check
          summary: 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Summarize AGENTS.md review
        if: always()
        run: python3 scripts/agents-review-summary.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-check
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
