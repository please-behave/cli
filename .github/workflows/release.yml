name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false' # Keep release jobs limited to their explicit tool subsets.

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-plan.yml@f214b49bd33bf21fbea5c4a9a3214fa83df6fa1d # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-readiness.yml@f214b49bd33bf21fbea5c4a9a3214fa83df6fa1d # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: Check

  release-candidate:
    name: Release Candidate (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUILD_TARGET: ${{ matrix.target }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: v${{ needs.plan.outputs.version }}
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python rust github:please-behave/cli
      - name: Stamp planned release version before verification
        run: python3 .github/scripts/set-release-version.py "$EXPECTED_RELEASE_VERSION"
      - name: Fetch locked candidate dependencies
        run: cargo fetch --locked
      - name: Build native candidate
        run: mise run build --offline
      - name: Capture candidate identity before quality checks
        run: python3 .github/scripts/smoke-receipt.py before
      - name: Validate native candidate behavior
        uses: christianpflugradt/please-behave-governance/actions/release/governance@ddb176f80831329b2328b9cf0c976f4e6f634c31 # updates/actions/release
        with:
          target: ${{ matrix.target }}
      - name: Verify smoke-tested candidate identity
        run: python3 .github/scripts/smoke-receipt.py after
      - name: Package smoke-tested candidate
        run: mise run package
      - name: Verify candidate archive
        run: python3 .github/scripts/verify-release.py "$EXPECTED_RELEASE_VERSION" --candidate
      - name: Record release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@ddb176f80831329b2328b9cf0c976f4e6f634c31 # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: ${{ matrix.target }}

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@ddb176f80831329b2328b9cf0c976f4e6f634c31 # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Verify collected release artifacts
        timeout-minutes: 3
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 .github/scripts/verify-release.py "$EXPECTED_RELEASE_VERSION"
      - name: Checksum all native archives
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Publish versioned CLI archives and release notes
        uses: christianpflugradt/please-behave-governance/actions/release/publish-release@ddb176f80831329b2328b9cf0c976f4e6f634c31 # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          force: ${{ inputs.force }}
          assets: |
            dist/*.tar.gz
            dist/SHA256SUMS
            README.md
            LICENSE
