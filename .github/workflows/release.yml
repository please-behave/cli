name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false' # Keep release jobs limited to their explicit tool subsets.

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/repository-catalog/.github/workflows/release-plan.yml@7804bdd85b2bfb225ae1dbcd684ebbc9192fe6bf # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/repository-catalog/.github/workflows/release-readiness.yml@7804bdd85b2bfb225ae1dbcd684ebbc9192fe6bf # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: check / Check

  release-candidate:
    name: Release Candidate (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUILD_TARGET: ${{ matrix.target }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: v${{ needs.plan.outputs.version }}
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: python rust github:please-behave/cli
          experimental: true
          version: 2026.11.12
      - name: Stamp planned release version before verification
        run: python3 .github/scripts/set-release-version.py "$EXPECTED_RELEASE_VERSION"
      - name: Fetch locked candidate dependencies
        run: cargo fetch --locked
      - name: Build native candidate
        run: mise run build --offline
      - name: Validate native candidate behavior
        uses: christianpflugradt/repository-catalog/actions/release/governance@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          target: ${{ matrix.target }}
      - name: Package smoke-tested candidate
        run: mise run package
      - name: Record release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: ${{ matrix.target }}

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: python node
          experimental: true
          version: 2026.11.12
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Checksum all native archives
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Publish versioned CLI archives and release notes
        uses: christianpflugradt/repository-catalog/actions/release/publish-release@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          source-sha: ${{ needs.plan.outputs.source_sha }}
          gateway-url: ${{ secrets.GATEWAY_URL }}
          force: ${{ inputs.force }}
          assets: |
            dist/*.tar.gz
            dist/SHA256SUMS
            README.md
            LICENSE
