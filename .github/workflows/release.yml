name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release verifies push access even during a dry run
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Plan next semantic release without publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Verify release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-readiness
          checks-only: 'true'
          summary: 'true'
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Release Candidate (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUILD_TARGET: ${{ matrix.target }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: v${{ needs.plan.outputs.version }}
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Stamp planned release version before verification
        run: python3 scripts/set-release-version.py "$EXPECTED_RELEASE_VERSION"
      - name: Install candidate toolchain and dependencies
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain stable "$BUILD_TARGET"
          cargo +stable fetch --locked
      - name: Validate and package native candidate
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-candidate
          checks-only: 'true'
          summary: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: please-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Record release candidate evidence
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-record
          checks-only: 'true'
          summary: 'true'
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: please-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: dist
          merge-multiple: true
      - name: Checksum all native archives
        run: python3 scripts/checksums.py
      - name: Verify collected release artifacts
        timeout-minutes: 3
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/check-release-artifacts.py
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Download release candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-evidence
          merge-multiple: true
      - name: Verify complete release candidate evidence
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-verify
          checks-only: 'true'
          summary: 'true'
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - name: Publish versioned CLI archives and release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm run release
