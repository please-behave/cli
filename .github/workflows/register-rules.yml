name: Register rules

on:
  push:
    branches: [main]
    paths:
      - '.please/checks/**/rule.toml'
      - '.please/checks/**/rule.yaml'
      - '.please/config.toml'
      - '.github/workflows/register-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.sha }}
  cancel-in-progress: true

jobs:
  register:
    uses: christianpflugradt/repository-catalog/.github/workflows/rule-registration.yml@6b7eb40dcec02efd229de38faab44106338706ce
    with:
      env: |
        BUILD_TARGET=x86_64-unknown-linux-gnu
        CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
    secrets:
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
